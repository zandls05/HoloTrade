max-shops-per-player: 5        # tiendas holograma
max-npc-shops-per-player: 3    # tiendas NPC
max-bulk: 64                   # maximo de compras con Shift+click en NPC

# Tipo DEMANDA (holograma)
demand-decay-seconds: 60
demand-money-step: 0.10        # +10% del precio en dinero por cada punto de demanda

# Fidelidad (NPC): descuento en pagos con dinero segun compras previas del jugador en esa tienda
loyalty:
  percent-per-purchase: 0.5
  max-percent: 15

npc:
  notify-owner: true
  menu-style: merchant           # merchant = interfaz de aldeano (Comercios) | chest = menu de inventario

display:
  height: 1.35

